<style>
body{font-family:sans-serif;margin:1.5em;color:#333;background:#f0f0f0}
#log{white-space:pre-wrap;font-family:monospace;font-size:0.85em;background:#eee;padding:1em;border:1px solid #ccc;max-height:20em;overflow-y:auto;margin-top:1em;cursor:pointer}
button{padding:10px;cursor:pointer;background:#444;color:#fff;border:none;border-radius:4px;display:block;margin-top:0.5em;margin-bottom:0.5em}
button:hover{background:#222}
.program-entry{margin-bottom:1.5em}
.program-name{font-weight:bold;margin-bottom:0.3em}
.program-desc{margin-bottom:0.5em}
#main-title{font-size:1.7em;font-weight:bold;margin-bottom:0.8em}
</style>
</head>
<body>
<div id="main-title"></div>
<div id="programs"></div>
<div id="log">Ready. Tap for info.</div>
<script>
const log = document.getElementById('log');
const print = (m) => { log.textContent = m; };

function applyProfile() {
    const profileEl = document.getElementById('unpackerProfile');
    if (!profileEl) return;
    let profile;
    try {
        profile = JSON.parse(profileEl.textContent.trim());
    } catch(e) {
        print('Error: Profile was corrupted');
        return;
    }
    profile.PackName = profile.PackName || 'HTML Unpacker';
    profile.TextColor = profile.TextColor || '#333';
    profile.BGColor = profile.BGColor || '#f0f0f0';

    const titleEl = document.getElementById('main-title');
    const packName = profile.PackName;
    const markEl = document.getElementById('authorMark');
    if (markEl && markEl.textContent && packName.toLowerCase().includes(markEl.textContent.trim().toLowerCase())) {
        const keyword = markEl.textContent.trim();
        const idx = packName.toLowerCase().indexOf(keyword.toLowerCase());
        titleEl.innerHTML = 
            packName.slice(0, idx) +
            '<br><span style="color: #0b7333;font-weight:normal;">' +
            packName.slice(idx, idx + keyword.length) +
            '</span>' +
            packName.slice(idx + keyword.length);
    } else {
        titleEl.textContent = packName;
    }

    document.body.style.color = profile.TextColor;
    document.body.style.backgroundColor = profile.BGColor;


    let styleEl = document.getElementById('custom-colors');
    if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'custom-colors';
        document.head.appendChild(styleEl);
    }
    if (profile.TextColor !== '#333' || profile.BGColor !== '#f0f0f0') {
        styleEl.textContent = `
            #log {
                border-color: ${profile.TextColor} !important;
                color: ${profile.TextColor} !important;
                background-color: ${profile.BGColor} !important;
            }
            button {
                background-color: ${profile.TextColor} !important;
                color: ${profile.BGColor} !important;
            }
            button:hover {
                background-color: ${profile.BGColor} !important;
                color: ${profile.TextColor} !important;
            }
        `;
    } else {
        styleEl.textContent = '';
    }
}
function decodeBase64ToBytes(base64) {
    try {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
    } catch (e) {
        throw new Error('Base64 decoding failed: ' + e.message);
    }
}


function encodeToBase64(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    let binary = '';
    data.forEach(byte => binary += String.fromCharCode(byte));
    return btoa(binary);
}

let clickTimer = null;
let clickCount = 0;
let infoShown = false;
log.addEventListener('click', () => {
    clickCount++;
    if (!infoShown && clickCount === 1) {
        print("HTML Unpacker 1.3\nTap multiple times to extract HTML Packer.");
        infoShown = true;
        clickTimer = setTimeout(() => { clickCount = 0; }, 600);
        return;
    }
    if (clickCount === 1) {
        clickTimer = setTimeout(() => { clickCount = 0; }, 600);
    } else if (clickCount === 3) {
        clearTimeout(clickTimer);
        clickCount = 0;
        const el = document.getElementById('packedCode0');
        if (!el) {
            print('Error: Ur080r0sProcess could not start');
            return;
        }
        const base64code = el.textContent.trim();
        if (!base64code) {
            print('Error: program 0 is empty');
            return;
        }
        print('Deploying HTML Packer...');
        try {
           
            const bytes = decodeBase64ToBytes(base64code);
            const decodedProgram0Str = new TextDecoder().decode(bytes);

           const fullHTML = document.documentElement.outerHTML;

const styleTagIndex = fullHTML.indexOf('<style');
if (styleTagIndex === -1) throw new Error('No <style> tag found');
const cleanHTML = window._initialCleanHTML;
const base64Clean = encodeToBase64(cleanHTML);


const modifiedProgram0 = '<!DOCTYPE html>\n<html lang="en">\n<!--THIS FILE NEEDS TO BE CODED FROM <STYLE> TO THE END IN BASE64 AND PUT IN PACKED CODE 0 SCRIPT OF HTML UNPACKER-->\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>HTML Packer<\/title>' +
    '<script id="storeCode" type="text/plain">' + base64Clean + '<\/script>' +
    decodedProgram0Str;


const blob = new Blob([modifiedProgram0], { type: 'text/html' });
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'HTML Packer.html';
a.click();
print('Saved: HTML Packer.html');
        } catch (e) {
            print('Error: ' + e.message);
        }
    }
});

function generate(n, metaEntry) {
    const el = document.getElementById('packedCode' + n);
    if (!el) {
        print('Error: program ' + n + ' not found');
        return;
    }
    const base64code = el.textContent.trim();
    if (!base64code) {
        print('Error: program ' + n + ' is empty');
        return;
    }
    const ext = metaEntry.ext;
    const name = metaEntry.name;
    print('Decoding and unpacking ' + name + '.' + ext + '...');
    try {
        const bytes = decodeBase64ToBytes(base64code);
        const mimeType = ext === 'html' ? 'text/html' : 'application/octet-stream';
        const blob = new Blob([bytes], { type: mimeType });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name + '.' + ext;
        a.click();
        print('Saved: ' + name + '.' + ext);
    } catch (e) {
        print('Error: ' + e.message);
    }
}

function init() {
	const fullHTML = document.documentElement.outerHTML;
    const styleTagIndex = fullHTML.indexOf('<style');
    if (styleTagIndex !== -1) {
        window._initialCleanHTML = fullHTML.substring(styleTagIndex);
    } else {
        window._initialCleanHTML = '';
    }

    applyProfile();

    const metaEl = document.getElementById('metaData');
    if (!metaEl) {
        print('No metadata found');
        return;
    }
    let meta;
    try {
        meta = JSON.parse(metaEl.textContent.trim());
    } catch (e) {
        print('Error parsing metadata JSON: ' + e.message);
        return;
    }
    if (!Array.isArray(meta) || meta.length === 0) {
        print('Metadata is empty or not an array');
        return;
    }

    const maxId = Math.max(...meta.map(item => item.id));
    const container = document.getElementById('programs');
    let anyDisplayed = false;

    for (let i = 1; i <= maxId; i++) {
        const programMeta = meta.find(p => p.id === i);
        if (!programMeta) continue;
        if (!programMeta.name || !programMeta.desc || !programMeta.ext) continue;
        const codeEl = document.getElementById('packedCode' + i);
        if (!codeEl || !codeEl.textContent.trim()) continue;

        const entry = document.createElement('div');
        entry.className = 'program-entry';
        const nameDiv = document.createElement('div');
        nameDiv.className = 'program-name';
        nameDiv.textContent = programMeta.name;
        const descDiv = document.createElement('div');
        descDiv.className = 'program-desc';
        descDiv.textContent = programMeta.desc;
        const btn = document.createElement('button');
        btn.textContent = 'Unpack';
        btn.addEventListener('click', () => generate(i, programMeta));
        entry.appendChild(nameDiv);
        entry.appendChild(descDiv);
        entry.appendChild(btn);
        container.appendChild(entry);
        anyDisplayed = true;
    }

    if (!anyDisplayed) {
        const msg = document.createElement('div');
        msg.style.fontWeight = 'bold';
        msg.textContent = 'Nothing packed here';
        container.appendChild(msg);
    }
}

window.addEventListener('DOMContentLoaded', init);
</script>
